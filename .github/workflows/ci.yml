name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      IBM_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Typecheck client
        run: cd client && npx tsc

      - name: Build client (with manifest)
        run: cd client && npx vite build --manifest

      - name: Build server
        run: npm run build:server

      - name: Print/export chunk guard
        run: cd client && npm run check:print-chunk

      - name: Typecheck tests
        run: npm run test:types

      - name: Run tests
        run: npm test

      - name: Typecheck client tests
        run: cd client && npm run test:types

      - name: Client component tests
        run: cd client && npm test

  docker:
    runs-on: ubuntu-latest
    # No `needs:` — this only exercises `docker build` against the Dockerfile,
    # which does its own `npm ci`/typecheck/build inside each stage and does
    # not consume anything build-and-test produces. Running it in parallel
    # gets the same coverage sooner instead of waiting behind an unrelated job.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      IBM_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Install Playwright browser
        run: cd client && npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: cd client && npm run test:e2e
        env:
          MSFSLOGGER_E2E_SCRATCH: ${{ runner.temp }}/msfslogger-e2e

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

      - name: Upload traces, screenshots and JUnit XML
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: client/test-results/
          retention-days: 7

  release:
    # Publishes a GitHub Release from an annotated `vX.Y.Z` tag push, once the
    # rest of CI is green on that commit. Needs the full run, not just
    # build-and-test, so a tag that fails e2e or the Docker build never ships.
    runs-on: ubuntu-latest
    needs: [build-and-test, docker, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json versions
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          ROOT_VERSION="$(jq -r .version package.json)"
          CLIENT_VERSION="$(jq -r .version client/package.json)"
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ] || [ "$TAG_VERSION" != "$CLIENT_VERSION" ]; then
            echo "::error::Tag $TAG (version $TAG_VERSION) does not match package.json ($ROOT_VERSION) / client/package.json ($CLIENT_VERSION)"
            exit 1
          fi

      - name: Skip if release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release from annotated tag
        if: steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # actions/checkout@v4 doesn't reliably fetch the annotated tag object
          # itself, only the commit it points at — fetch it explicitly before
          # reading its subject/body.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # A lightweight tag has no annotation to publish a Release from —
          # `git tag -l --format` silently reads the pointed-to commit's
          # subject/body instead, which would ship a Release titled after
          # whatever commit happened to be at HEAD. Require an annotated tag.
          TAG_TYPE="$(git cat-file -t "refs/tags/$TAG")"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag, not an annotated one. Delete it (git push origin :refs/tags/$TAG && git tag -d $TAG), re-tag with git tag -a $TAG, and push the tag again."
            exit 1
          fi
          SUBJECT="$(git tag -l "$TAG" --format='%(contents:subject)')"
          if [ -z "$SUBJECT" ]; then
            echo "::error::$TAG has an empty message. Delete it (git push origin :refs/tags/$TAG && git tag -d $TAG) and re-tag with git tag -a $TAG and a message whose first line is the Release title."
            exit 1
          fi
          BODY="$(git tag -l "$TAG" --format='%(contents:body)')"
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --verify-tag --title "$SUBJECT" --notes "$BODY"
